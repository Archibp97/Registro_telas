<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registro rápido · Panorama</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --canvas:#F2F3EF;
  --card:#FFFFFF;
  --ink:#16211D;
  --ink-soft:#5B6660;
  --ink-faint:#8D958F;
  --border:#DEE1D9;
  --border-soft:#EBEDE7;
  --primary:#2F5C82;
  --primary-ink:#E9F0F6;
  --primary-dark:#20415C;
  --accent:#B5652E;
  --success:#3E7A5B;
  --success-ink:#E7F3EC;
  --danger:#B23A3A;
  --radius:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--canvas);color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
body{padding-bottom:96px;}
.mono{font-family:'IBM Plex Mono',monospace;}
h1,h2,h3{font-family:'Fraunces',serif;margin:0;}

.wrap{max-width:760px;margin:0 auto;padding:28px 18px 20px;}

.header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:22px;}
.header h1{font-size:22px;font-weight:600;letter-spacing:-0.01em;}
.header .tag{font-size:11px;color:var(--ink-faint);font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.06em;}
.hist-btn{border:1px solid var(--border);background:var(--card);color:var(--ink-soft);
  font-size:12.5px;font-family:'Inter';padding:7px 12px;border-radius:100px;cursor:pointer;
  display:flex;align-items:center;gap:6px;transition:.15s;}
.hist-btn:hover{border-color:var(--primary);color:var(--primary);}
.hist-btn .count{background:var(--ink);color:#fff;border-radius:100px;font-size:10.5px;
  padding:1px 6px;font-family:'IBM Plex Mono';}

section.step{margin-bottom:26px;}
.step-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;
  color:var(--ink-faint);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.step-label .n{width:16px;height:16px;border-radius:50%;background:var(--ink);color:#fff;
  font-size:9.5px;display:inline-flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono';}

/* Tipo cards */
.tipo-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
@media (max-width:560px){.tipo-grid{grid-template-columns:1fr;}}
.tipo-card{border:1px solid var(--border);background:var(--card);border-radius:var(--radius);
  padding:12px 13px;cursor:pointer;text-align:left;transition:.12s;position:relative;}
.tipo-card:hover{border-color:#B9C2BC;}
.tipo-card.active{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary) inset;background:var(--primary-ink);}
.tipo-card .name{font-weight:600;font-size:13.5px;display:flex;justify-content:space-between;gap:8px;}
.tipo-card .desc{font-size:11.5px;color:var(--ink-soft);margin-top:3px;line-height:1.4;}
.tipo-card .mode-pill{font-size:9px;font-family:'IBM Plex Mono';text-transform:uppercase;
  letter-spacing:.04em;color:var(--ink-faint);border:1px solid var(--border);border-radius:100px;
  padding:1px 6px;white-space:nowrap;}
.tipo-card.active .mode-pill{color:var(--primary);border-color:var(--primary);}
.check{color:var(--primary);font-size:13px;}

/* search */
.search{position:relative;margin-bottom:9px;}
.search input{width:100%;border:1px solid var(--border);background:var(--card);border-radius:8px;
  padding:9px 12px 9px 32px;font-size:13.5px;font-family:'Inter';color:var(--ink);}
.search input:focus{outline:none;border-color:var(--primary);}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-faint);}

/* catalogo chips */
.cat-scroll{max-height:200px;overflow-y:auto;border:1px solid var(--border-soft);border-radius:var(--radius);
  background:var(--card);padding:9px;}
.cat-grid{display:flex;flex-wrap:wrap;gap:6px;}
.cat-chip{display:flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--canvas);
  border-radius:100px;padding:5px 11px 5px 8px;font-size:12.5px;cursor:pointer;transition:.12s;color:var(--ink);}
.cat-chip:hover{border-color:#B9C2BC;}
.cat-chip .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.cat-chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.empty-note{font-size:12.5px;color:var(--ink-faint);padding:6px 2px;}

/* cantidad mode */
.cantidad-box{max-width:220px;}
.cantidad-box input{width:100%;font-size:26px;font-family:'IBM Plex Mono';padding:12px 14px;
  border:1px solid var(--border);border-radius:var(--radius);background:var(--card);color:var(--ink);}
.cantidad-box input:focus{outline:none;border-color:var(--primary);}
.cantidad-box label{font-size:12px;color:var(--ink-soft);display:block;margin-bottom:6px;}

/* telas table */
.telas-toolbar{display:flex;gap:8px;align-items:center;margin-bottom:9px;}
.telas-toolbar .search{flex:1;margin-bottom:0;}
.clear-btn{font-size:12px;color:var(--ink-faint);background:none;border:1px solid var(--border);
  border-radius:8px;padding:8.5px 11px;cursor:pointer;white-space:nowrap;}
.clear-btn:hover{color:var(--danger);border-color:var(--danger);}
.telas-list{border:1px solid var(--border-soft);border-radius:var(--radius);background:var(--card);
  max-height:360px;overflow-y:auto;}
.tela-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--border-soft);}
.tela-row:last-child{border-bottom:none;}
.tela-row.filled{background:var(--primary-ink);}
.tela-row .name{flex:1;font-size:13px;line-height:1.3;}
.tela-row input{width:78px;text-align:right;font-family:'IBM Plex Mono';font-size:14px;
  border:1px solid var(--border);border-radius:7px;padding:6px 8px;color:var(--ink);background:#fff;}
.tela-row input:focus{outline:none;border-color:var(--primary);}
.tela-row.filled input{border-color:var(--primary);}
.no-results{padding:24px 12px;text-align:center;color:var(--ink-faint);font-size:13px;}
.select-catalogo-msg{font-size:13px;color:var(--ink-faint);border:1px dashed var(--border);
  border-radius:var(--radius);padding:16px;text-align:center;}

/* nota */
textarea{width:100%;border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;
  font-family:'Inter';font-size:13.5px;color:var(--ink);resize:vertical;min-height:56px;background:var(--card);}
textarea:focus{outline:none;border-color:var(--primary);}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(242,243,239,.92);backdrop-filter:blur(8px);
  border-top:1px solid var(--border);z-index:30;}
.bar-inner{max-width:760px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;
  justify-content:space-between;gap:14px;}
.bar-summary{font-size:12.5px;color:var(--ink-soft);}
.bar-summary b{color:var(--ink);font-family:'IBM Plex Mono';font-weight:500;}
.save-btn{background:var(--ink);color:#fff;border:none;border-radius:100px;padding:11px 22px;
  font-size:13.5px;font-weight:600;cursor:pointer;font-family:'Inter';display:flex;align-items:center;gap:8px;
  transition:.15s;white-space:nowrap;}
.save-btn:hover{background:var(--primary-dark);}
.save-btn:disabled{background:#B9BFB9;cursor:not-allowed;}
.save-btn.saved{background:var(--success);}

/* toast */
.toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--ink);
  color:#fff;padding:9px 16px;border-radius:100px;font-size:12.5px;opacity:0;pointer-events:none;
  transition:.2s;z-index:40;display:flex;align-items:center;gap:7px;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* history drawer */
.overlay{position:fixed;inset:0;background:rgba(20,26,22,.35);z-index:45;opacity:0;pointer-events:none;transition:.2s;}
.overlay.show{opacity:1;pointer-events:auto;}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,92vw);background:var(--canvas);z-index:46;
  transform:translateX(100%);transition:.25s cubic-bezier(.2,.8,.3,1);box-shadow:-8px 0 24px rgba(0,0,0,.08);
  display:flex;flex-direction:column;}
.drawer.show{transform:translateX(0);}
.drawer-head{padding:18px 18px 12px;border-bottom:1px solid var(--border);display:flex;
  justify-content:space-between;align-items:center;}
.drawer-head h2{font-size:17px;}
.drawer-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink-soft);line-height:1;}
.drawer-actions{padding:10px 18px;display:flex;gap:8px;border-bottom:1px solid var(--border-soft);}
.pill-btn{flex:1;font-size:12px;border:1px solid var(--border);background:var(--card);border-radius:8px;
  padding:8px 10px;cursor:pointer;color:var(--ink-soft);}
.pill-btn:hover{border-color:var(--primary);color:var(--primary);}
.drawer-list{flex:1;overflow-y:auto;padding:10px 18px 18px;}
.hist-item{border:1px solid var(--border);background:var(--card);border-radius:var(--radius);
  padding:11px 13px;margin-bottom:8px;}
.hist-item .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;}
.hist-item .tipo{font-size:12.5px;font-weight:600;}
.hist-item .fecha{font-size:10.5px;color:var(--ink-faint);font-family:'IBM Plex Mono';white-space:nowrap;}
.hist-item .cat{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.hist-item .resumen{font-size:11.5px;color:var(--ink-faint);margin-top:5px;font-family:'IBM Plex Mono';}
.hist-item .del{font-size:11px;color:var(--danger);background:none;border:none;cursor:pointer;
  margin-top:7px;padding:0;}
.drawer-empty{color:var(--ink-faint);font-size:13px;text-align:center;padding:40px 10px;}

/* export modal */
.modal-back{position:fixed;inset:0;background:rgba(20,26,22,.45);z-index:50;display:none;
  align-items:center;justify-content:center;padding:20px;}
.modal-back.show{display:flex;}
.modal{background:#fff;border-radius:var(--radius);max-width:560px;width:100%;padding:18px;
  max-height:80vh;display:flex;flex-direction:column;}
.modal h3{font-size:15px;margin-bottom:8px;}
.modal textarea{flex:1;min-height:220px;font-family:'IBM Plex Mono';font-size:11.5px;background:var(--canvas);}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:10px;}

.loading{padding:60px 20px;text-align:center;color:var(--ink-faint);font-size:13px;}
</style>
</head>
<body>

<div class="wrap" id="app">
  <div class="loading">Cargando catálogos…</div>
</div>

<div class="toast" id="toast"></div>
<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <h2>Historial</h2>
    <button class="drawer-close" id="drawerClose">✕</button>
  </div>
  <div class="drawer-actions">
    <button class="pill-btn" id="exportAllBtn">Exportar todo (CSV)</button>
  </div>
  <div class="drawer-list" id="drawerList"></div>
</div>

<div class="modal-back" id="modalBack">
  <div class="modal">
    <h3>Exportar CSV</h3>
    <textarea id="exportText" readonly></textarea>
    <div class="modal-foot">
      <button class="pill-btn" id="copyBtn" style="flex:none;">Copiar</button>
      <button class="pill-btn" id="modalCloseBtn" style="flex:none;">Cerrar</button>
    </div>
  </div>
</div>

function hueFor(str){
  let h = 0;
  for (let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) % 360; }
  return h;
}

function mode(){
  const t = TIPOS.find(t=>t.id===state.tipoId);
  return t ? t.mode : null;
}

function fmtNum(n){ return new Intl.NumberFormat('es-CO').format(n); }

function el(html){
  const d = document.createElement('div');
  d.innerHTML = html.trim();
  return d.firstElementChild;
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove('show'), 2200);
}

const SB_TABLE = 'registros_panorama';
const SB_HEADERS = {
  'apikey': SUPABASE_ANON_KEY,
  'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
  'Content-Type': 'application/json',
};

async function loadHistory(){
  try{
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/${SB_TABLE}?select=*&order=created_at.desc&limit=300`,
      { headers: SB_HEADERS }
    );
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  }catch(e){
    console.error('supabase load error', e);
    return null; // null = fallo de red, distinto de [] = sin registros
  }
}

async function insertRegistro(rows){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${SB_TABLE}`, {
      method: 'POST',
      headers: { ...SB_HEADERS, 'Prefer': 'return=representation' },
      body: JSON.stringify(rows),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return true;
  }catch(e){
    console.error('supabase insert error', e);
    return false;
  }
}

async function deleteRegistro(ids){
  const list = Array.isArray(ids) ? ids : [ids];
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${SB_TABLE}?id=in.(${list.join(',')})`, {
      method: 'DELETE',
      headers: SB_HEADERS,
    });
    return res.ok;
  }catch(e){
    console.error('supabase delete error', e);
    return false;
  }
}

function render(){
  const app = document.getElementById('app');
  const m = mode();

  const tipoCards = TIPOS.map(t=>`
    <button type="button" class="tipo-card ${state.tipoId===t.id?'active':''}" data-tipo="${t.id}">
      <div class="name"><span>${t.label}</span>${state.tipoId===t.id?'<span class="check">✓</span>':''}</div>
      <div class="desc">${t.desc}</div>
      <div style="margin-top:8px;"><span class="mode-pill">${t.mode==='cantidad'?'cantidad única':'telas + cantidades'}</span></div>
    </button>`).join('');

  const catQ = state.catBusqueda.trim().toLowerCase();
  const catList = DATA.catalogos.filter(c=>!catQ || c.nombre.toLowerCase().includes(catQ));
  const catChips = catList.map(c=>{
    const hue = hueFor(c.nombre);
    return `<button type="button" class="cat-chip ${state.catalogoId===c.id?'active':''}" data-cat="${c.id}">
      <span class="dot" style="background:hsl(${hue} 55% 45%)"></span>${c.nombre}
    </button>`;
  }).join('') || `<div class="empty-note">Sin resultados</div>`;

  let step3 = '';
  if (m === 'cantidad'){
    step3 = `
      <div class="cantidad-box">
        <label for="cantidadInput">Cantidad a producir</label>
        <input id="cantidadInput" type="number" inputmode="decimal" min="0" step="any"
          placeholder="0" value="${state.cantidad}">
      </div>`;
  } else if (m === 'telas'){
    if (!state.catalogoId){
      step3 = `<div class="select-catalogo-msg">Selecciona un catálogo para ver sus telas.</div>`;
    } else {
      const telas = DATA.telas[state.catalogoId] || [];
      const q = state.telaBusqueda.trim().toLowerCase();
      const filtered = telas.filter(t=>!q || t.nombre.toLowerCase().includes(q));
      const rows = filtered.map(t=>{
        const val = state.cantidades[t.id] ?? '';
        return `<div class="tela-row ${val?'filled':''}">
          <span class="name">${t.nombre}</span>
          <input type="number" inputmode="decimal" min="0" step="any" placeholder="0"
            data-tela="${t.id}" value="${val}">
        </div>`;
      }).join('') || `<div class="no-results">Ninguna tela coincide con “${state.telaBusqueda}”.</div>`;

      step3 = `
        <div class="telas-toolbar">
          <div class="search">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <input id="telaSearch" placeholder="Filtrar telas de ${DATA.catalogos.find(c=>c.id===state.catalogoId)?.nombre || ''}…" value="${state.telaBusqueda}">
          </div>
          <button type="button" class="clear-btn" id="clearCantidades">Limpiar</button>
        </div>
        <div class="telas-list" id="telasList">${rows}</div>`;
    }
  } else {
    step3 = `<div class="select-catalogo-msg">Elige primero qué se va a registrar.</div>`;
  }

  const nItems = Object.values(state.cantidades).filter(v=>Number(v)>0).length;
  const totalItems = Object.values(state.cantidades).reduce((a,v)=>a+(Number(v)>0?Number(v):0),0);
  const summary = m==='cantidad'
    ? `Cantidad: <b>${fmtNum(Number(state.cantidad)||0)}</b>`
    : `<b>${nItems}</b> tela(s) · total <b>${fmtNum(totalItems)}</b>`;

  app.innerHTML = `
    <div class="header">
      <div>
        <h1>Registrar catálogos y telas</h1>
        <div class="tag">panorama · registro rápido</div>
      </div>
      <button class="hist-btn" id="openHistory">Historial <span class="count" id="histCount">…</span></button>
    </div>

    <section class="step">
      <div class="step-label"><span class="n">1</span>Qué se va a registrar</div>
      <div class="tipo-grid">${tipoCards}</div>
    </section>

    <section class="step">
      <div class="step-label"><span class="n">2</span>Catálogo</div>
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="catSearch" placeholder="Buscar catálogo…" value="${state.catBusqueda}">
      </div>
      <div class="cat-scroll"><div class="cat-grid">${catChips}</div></div>
    </section>

    <section class="step">
      <div class="step-label"><span class="n">3</span>${m==='cantidad' ? 'Cantidad' : 'Telas y cantidades'}</div>
      ${step3}
    </section>

    <section class="step">
      <div class="step-label" style="margin-bottom:6px;">Nota (opcional)</div>
      <textarea id="nota" maxlength="500" placeholder="Observaciones del movimiento">${state.nota}</textarea>
    </section>
  `;

  document.querySelectorAll('[data-tipo]').forEach(b=>b.addEventListener('click', ()=>{
    state.tipoId = b.dataset.tipo;
    state.cantidad=''; state.cantidades={}; state.telaBusqueda='';
    render();
  }));

  document.getElementById('catSearch').addEventListener('input', e=>{
    state.catBusqueda = e.target.value; render(); focusEl('catSearch');
  });
  document.querySelectorAll('[data-cat]').forEach(b=>b.addEventListener('click', ()=>{
    state.catalogoId = b.dataset.cat; state.cantidades={}; state.telaBusqueda='';
    render();
  }));

  if (m==='cantidad'){
    const input = document.getElementById('cantidadInput');
    input.addEventListener('input', e=>{ state.cantidad = e.target.value; updateBar(); });
  }

  if (m==='telas' && state.catalogoId){
    const ts = document.getElementById('telaSearch');
    ts.addEventListener('input', e=>{ state.telaBusqueda = e.target.value; render(); focusEl('telaSearch'); });
    document.getElementById('clearCantidades').addEventListener('click', ()=>{
      state.cantidades = {}; render();
    });
    document.querySelectorAll('[data-tela]').forEach(inp=>{
      inp.addEventListener('input', e=>{
        const id = e.target.dataset.tela;
        state.cantidades[id] = e.target.value;
        e.target.closest('.tela-row').classList.toggle('filled', !!e.target.value && Number(e.target.value)>0);
        updateBar();
      });
      inp.addEventListener('keydown', e=>{
        if (e.key==='Enter'){
          e.preventDefault();
          const rows = Array.from(document.querySelectorAll('#telasList input'));
          const idx = rows.indexOf(e.target);
          if (idx>-1 && idx<rows.length-1) rows[idx+1].focus(); else e.target.blur();
        }
      });
    });
  }

  document.getElementById('nota').addEventListener('input', e=>{ state.nota = e.target.value; });
  document.getElementById('openHistory').addEventListener('click', openHistory);

  renderBar();
  refreshHistCount();
}

function focusEl(id){
  const elm = document.getElementById(id);
  if (elm){ elm.focus(); const v=elm.value; elm.value=''; elm.value=v; }
}

function renderBar(){
  let bar = document.getElementById('bottomBar');
  if (!bar){
    bar = el(`<div class="bar" id="bottomBar"><div class="bar-inner">
      <div class="bar-summary" id="barSummary"></div>
      <button class="save-btn" id="saveBtn">Guardar registro</button>
    </div></div>`);
    document.body.appendChild(bar);
    document.getElementById('saveBtn').addEventListener('click', onSave);
  }
  updateBar();
}

function updateBar(){
  const m = mode();
  const nItems = Object.values(state.cantidades).filter(v=>Number(v)>0).length;
  const totalItems = Object.values(state.cantidades).reduce((a,v)=>a+(Number(v)>0?Number(v):0),0);
  const summary = m==='cantidad'
    ? `Cantidad: <b>${fmtNum(Number(state.cantidad)||0)}</b>`
    : m==='telas'
      ? `<b>${nItems}</b> tela(s) seleccionada(s) · total <b>${fmtNum(totalItems)}</b>`
      : 'Elige el tipo de registro para empezar';
  document.getElementById('barSummary').innerHTML = summary;
}

async function onSave(){
  const m = mode();
  if (!state.tipoId) return toast('Elige qué se va a registrar');
  if (!state.catalogoId) return toast('Selecciona un catálogo');
  if (m==='cantidad' && !(Number(state.cantidad)>0)) return toast('Ingresa una cantidad válida');

  let items = [];
  if (m==='telas'){
    const telas = DATA.telas[state.catalogoId] || [];
    items = Object.entries(state.cantidades)
      .map(([id,v])=>({ id, cantidad: Number(v) }))
      .filter(i=>Number.isFinite(i.cantidad) && i.cantidad>0)
      .map(i=>({...i, nombre: (telas.find(t=>t.id===i.id)||{}).nombre || i.id }));
    if (items.length===0) return toast('Ingresa la cantidad de al menos una tela');
  }

  const tipo = TIPOS.find(t=>t.id===state.tipoId);
  const catalogo = DATA.catalogos.find(c=>c.id===state.catalogoId);
  const notaVal = state.nota.trim() || null;

  // Una fila por tela (mismo catálogo, misma tanda) — nunca un solo registro con varias telas adentro.
  const rows = m==='telas'
    ? items.map(i=>({
        tipo_id: tipo.id,
        tipo_label: tipo.label,
        catalogo_id: catalogo.id,
        catalogo_nombre: catalogo.nombre,
        tela_id: i.id,
        tela_nombre: i.nombre,
        cantidad: i.cantidad,
        nota: notaVal,
      }))
    : [{
        tipo_id: tipo.id,
        tipo_label: tipo.label,
        catalogo_id: catalogo.id,
        catalogo_nombre: catalogo.nombre,
        tela_id: null,
        tela_nombre: null,
        cantidad: Number(state.cantidad),
        nota: notaVal,
      }];

  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.textContent = 'Guardando…';

  const ok = await insertRegistro(rows);

  if (!ok){
    btn.disabled = false;
    btn.textContent = 'Guardar registro';
    toast('No se pudo guardar. Revisa tu conexión e intenta de nuevo.');
    return;
  }

  btn.classList.add('saved');
  btn.textContent = 'Guardado ✓';
  toast(rows.length>1 ? `${rows.length} filas guardadas en Supabase` : 'Registro guardado en Supabase');

  setTimeout(()=>{
    state.cantidad=''; state.cantidades={}; state.nota=''; state.telaBusqueda='';
    btn.disabled = false; btn.classList.remove('saved'); btn.textContent = 'Guardar registro';
    render();
    refreshHistCount();
  }, 650);
}


async function refreshHistCount(){
  const list = await loadHistory();
  const c = document.getElementById('histCount');
  if (c) c.textContent = list===null ? '!' : list.length;
}

async function openHistory(){
  const drawerList = document.getElementById('drawerList');
  drawerList.innerHTML = `<div class="drawer-empty">Cargando…</div>`;
  document.getElementById('overlay').classList.add('show');
  document.getElementById('drawer').classList.add('show');

  const list = await loadHistory();

  if (list===null){
    drawerList.innerHTML = `<div class="drawer-empty">No se pudo conectar con Supabase.<br>Revisa tu conexión e intenta de nuevo.</div>`;
    return;
  }
  if (list.length===0){
    drawerList.innerHTML = `<div class="drawer-empty">Todavía no has guardado registros.</div>`;
    return;
  }

  // Cada tela es su propia fila en Supabase; aquí solo las agrupamos visualmente
  // cuando vienen de la misma tanda (mismo catálogo + mismo instante de guardado).
  const groups = [];
  list.forEach(r=>{
    const key = `${r.created_at}|${r.catalogo_id}|${r.tipo_id}`;
    const last = groups[groups.length-1];
    if (last && last.key===key){ last.rows.push(r); }
    else { groups.push({ key, rows: [r] }); }
  });

  drawerList.innerHTML = groups.map(g=>{
    const r0 = g.rows[0];
    const ids = g.rows.map(r=>r.id);
    const fecha = new Date(r0.created_at);
    const fechaStr = fecha.toLocaleDateString('es-CO',{day:'2-digit',month:'short'}) + ' · ' +
      fecha.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});

    const resumen = g.rows.length===1 && r0.tela_nombre==null
      ? `Cantidad: ${fmtNum(r0.cantidad)}`
      : g.rows.map(r=>`${r.tela_nombre}: ${fmtNum(r.cantidad)}`).join(' · ');

    return `<div class="hist-item" data-ids="${ids.join(',')}">
      <div class="top">
        <div>
          <div class="tipo">${r0.tipo_label}</div>
          <div class="cat">${r0.catalogo_nombre}${g.rows.length>1 ? ` · ${g.rows.length} filas` : ''}</div>
        </div>
        <div class="fecha">${fechaStr}</div>
      </div>
      <div class="resumen">${resumen}</div>
      ${r0.nota ? `<div class="resumen" style="margin-top:3px;">"${escapeHtml(r0.nota)}"</div>` : ''}
      <button class="del" data-del="${ids.join(',')}">Eliminar</button>
    </div>`;
  }).join('');

  drawerList.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', async ()=>{
    b.textContent = 'Eliminando…';
    b.disabled = true;
    const ids = b.dataset.del.split(',');
    const ok = await deleteRegistro(ids);
    if (!ok){ toast('No se pudo eliminar. Intenta de nuevo.'); b.textContent='Eliminar'; b.disabled=false; return; }
    openHistory();
    refreshHistCount();
  }));
}

function closeHistory(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('drawer').classList.remove('show');
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function toCSV(list){
  const rows = [['fecha','tipo','catalogo','tela','cantidad','nota']];
  list.forEach(r=>{
    rows.push([r.created_at, r.tipo_label, r.catalogo_nombre, r.tela_nombre||'', r.cantidad, r.nota||'']);
  });
  return rows.map(row=>row.map(v=>{
    const s = String(v ?? '');
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\n');
}

async function exportAll(){
  const list = await loadHistory();
  if (list===null) return toast('No se pudo conectar con Supabase');
  if (list.length===0) return toast('No hay registros para exportar');
  const csv = toCSV(list);
  document.getElementById('exportText').value = csv;
  document.getElementById('modalBack').classList.add('show');
}

document.getElementById('overlay').addEventListener('click', closeHistory);
document.getElementById('drawerClose').addEventListener('click', closeHistory);
document.getElementById('exportAllBtn').addEventListener('click', exportAll);
document.getElementById('modalCloseBtn').addEventListener('click', ()=>document.getElementById('modalBack').classList.remove('show'));
document.getElementById('copyBtn').addEventListener('click', async ()=>{
  const ta = document.getElementById('exportText');
  ta.select();
  try{
    await navigator.clipboard.writeText(ta.value);
    toast('CSV copiado');
  }catch(e){
    toast('Selecciona y copia con Ctrl+C');
  }
});

render();
</script>
</body>
</html>
